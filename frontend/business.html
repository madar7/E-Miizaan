<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>E-Miizaan — Business Profile</title>
<script src="js/theme.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/i18n/so.js"></script>
<script src="js/i18n/ar.js"></script>
<script src="js/i18n/i18n.js"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="business">
  <div class="titlebar" id="titlebar"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <h1 class="page-title">Business Profile</h1>
      <div id="pageMsg" class="msg" hidden></div>

      <section class="panel">
        <div class="avatar-upload">
          <img class="avatar-preview" id="logoPreview" alt="" style="border-radius:6px;" />
          <div>
            <input type="file" id="logoFile" accept="image/jpeg,image/png,image/webp" hidden />
            <button type="button" class="btn ghost" id="logoUploadBtn">Change logo</button>
            <button type="button" class="btn ghost" id="logoRemoveBtn">Remove</button>
            <p style="font-size:0.8125rem;color:var(--muted);margin:8px 0 0;">JPG, PNG or WEBP, up to 2MB.</p>
          </div>
        </div>

        <form id="businessForm" class="form-row">
          <div class="field wide">
            <label>Business name</label>
            <input type="text" id="bizName" required />
          </div>
          <div class="field">
            <label>Owner name</label>
            <input type="text" id="bizOwner" />
          </div>
          <div class="field">
            <label>Business type</label>
            <input type="text" id="bizType" placeholder="e.g. Retail, Services" />
          </div>
          <div class="field">
            <label>Phone</label>
            <input type="text" id="bizPhone" />
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" id="bizEmail" />
          </div>
          <div class="field wide">
            <label>Address</label>
            <input type="text" id="bizAddress" />
          </div>
          <div class="field">
            <label>Website</label>
            <input type="text" id="bizWebsite" placeholder="https://" />
          </div>
          <div class="form-actions"><button type="submit" class="btn" data-i18n="save">Save</button></div>
        </form>
      </section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/business.js"></script>
</body>
</html>
