<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>E-Miizaan — Dashboard</title>
<script src="js/theme.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/i18n/so.js"></script>
<script src="js/i18n/ar.js"></script>
<script src="js/i18n/i18n.js"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="dashboard">
  <div class="titlebar" id="titlebar"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div id="pageMsg" class="msg" hidden></div>

      <section class="panel">
        <h2 id="incomeSectionTitle" data-i18n="incomesData">Income's Data</h2>
        <div class="tiles" id="incomeTiles"></div>
      </section>

      <section class="panel">
        <h2 data-i18n="expensesData">Expense's Data</h2>
        <div class="tiles" id="expenseTiles"></div>
      </section>

      <div class="totals">
        <section class="panel">
          <!-- No data-i18n here: dashboard.js sets this dynamically (Total Income vs
               Total Revenue depending on account type) — a static data-i18n attribute
               would race with that and win on every page load, see dashboard.js. -->
          <h2 id="totalIncomeLabel">Total Income</h2>
          <div class="tiles single" id="totalIncome"></div>
        </section>
        <section class="panel">
          <h2 id="totalExpenseLabel" data-i18n="totalExpenses">Total Expenses</h2>
          <div class="tiles single" id="totalExpense"></div>
        </section>
        <section class="panel">
          <h2 id="totalBalanceLabel">Balance</h2>
          <div class="tiles single" id="totalBalance"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
