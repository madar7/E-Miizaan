<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>E-Miizaan — Forgot password</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-bg">
    <div class="auth-window">
      <div class="auth-left">
        <div class="auth-avatar" id="authAvatar"></div>
        <h1 class="auth-title">E-Miizaan</h1>
        <p class="auth-sub">Income and Expenses Tracker</p>
        <div class="auth-switch">
          <a href="index.html" class="btn-outline">Back to sign in</a>
        </div>
      </div>
      <div class="auth-right">
        <h2>FORGOT PASSWORD</h2>
        <div id="errorBox" class="msg error" hidden></div>
        <div id="successBox" class="msg success" hidden></div>
        <p class="auth-note">Enter the email you registered with. If it matches an account, we'll send a link to reset your password.</p>
        <form id="forgotForm">
          <div class="field">
            <label for="forgotEmail">Email</label>
            <input type="email" id="forgotEmail" required autocomplete="email" />
          </div>
          <button type="submit" class="btn" id="submitBtn">Send reset link</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/icons.js"></script>
  <script>
    document.getElementById("authAvatar").innerHTML = ICONS.avatar;
    const form = document.getElementById("forgotForm");
    const errorBox = document.getElementById("errorBox");
    const successBox = document.getElementById("successBox");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideMsg(errorBox);
      hideMsg(successBox);
      submitBtn.disabled = true;
      submitBtn.textContent = "Sending…";
      try {
        const data = await apiRequest("/auth/forgot-password", {
          method: "POST",
          auth: false,
          body: { email: document.getElementById("forgotEmail").value.trim() },
        });
        showMsg(successBox, data.message, "success");
        form.reset();
      } catch (err) {
        showMsg(errorBox, err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Send reset link";
      }
    });
  </script>
</body>
</html>
