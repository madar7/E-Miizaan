<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>E-Miizaan — Income</title>
<script src="js/theme.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/i18n/so.js"></script>
<script src="js/i18n/ar.js"></script>
<script src="js/i18n/i18n.js"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="income" data-type="income">
  <div class="titlebar" id="titlebar"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div id="pageMsg" class="msg" hidden></div>

      <section class="panel">
        <h2 id="formTitle">Add Income</h2>
        <form id="txnForm" class="form-row">
          <div class="field">
            <label for="txnCategory">Category</label>
            <select id="txnCategory" required></select>
          </div>
          <div class="field">
            <label for="txnAmount">Amount</label>
            <input type="number" id="txnAmount" step="0.01" min="0.01" required />
          </div>
          <div class="field">
            <label for="txnDate">Date</label>
            <input type="date" id="txnDate" required />
          </div>
          <div class="field">
            <label for="txnPaymentMethod">Payment method</label>
            <select id="txnPaymentMethod">
              <option value="">—</option>
              <option value="Cash">Cash</option>
              <option value="Bank">Bank</option>
              <option value="Mobile Money">Mobile Money</option>
              <option value="EVC Plus">EVC Plus</option>
              <option value="Sahal">Sahal</option>
              <option value="eDahab">eDahab</option>
              <option value="Premier Wallet">Premier Wallet</option>
              <option value="Credit Card">Credit Card</option>
              <option value="Debit Card">Debit Card</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="field wide">
            <label for="txnDescription">Description (optional)</label>
            <input type="text" id="txnDescription" maxlength="200" />
          </div>
          <div class="field wide">
            <label for="txnNotes">Notes (optional)</label>
            <input type="text" id="txnNotes" maxlength="500" />
          </div>
          <div class="form-actions">
            <button type="submit" class="btn" id="saveBtn">Add Income</button>
            <button type="button" class="btn ghost" id="cancelEdit" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2>Income History</h2>
        <div class="filters">
          <input type="text" id="searchInput" placeholder="Search category or description…" />
          <select id="filterCategory"></select>
          <input type="date" id="startDate" title="From" />
          <input type="date" id="endDate" title="To" />
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Description</th>
                <th class="num">Amount</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="txnTableBody"></tbody>
          </table>
        </div>
        <div id="emptyState" class="empty-state" hidden>No income recorded yet. Add your first one above.</div>

        <div class="pagination">
          <span id="pageInfo"></span>
          <button id="prevPage">Prev</button>
          <button id="nextPage">Next</button>
        </div>
      </section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/transactions.js"></script>
</body>
</html>
