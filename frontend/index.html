<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>E-Miizaan — Sign in</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-bg">
    <div class="auth-window">
      <div class="auth-left">
        <div class="auth-avatar" id="authAvatar"></div>
        <h1 class="auth-title">E-Miizaan</h1>
        <p class="auth-sub">Income and Expenses Tracker</p>
        <div class="auth-switch">
          <div id="switchText">REGISTER HERE</div>
          <button type="button" class="btn-outline" id="switchBtn">SIGNUP</button>
        </div>
      </div>

      <div class="auth-right">
        <div id="errorBox" class="msg error" hidden></div>

        <form id="loginForm">
          <h2>SIGN IN</h2>
          <div class="field">
            <label for="loginUsername">Username</label>
            <input type="text" id="loginUsername" required autocomplete="username" autocapitalize="none" />
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" required autocomplete="current-password" />
          </div>
          <label class="show-pass"><input type="checkbox" id="showLoginPass" /> Show Password</label>
          <button type="submit" class="btn">Login</button>
          <div class="auth-links"><a href="forgot-password.html">Forgot password?</a></div>
        </form>

        <form id="registerForm" hidden>
          <h2>SIGN UP</h2>
          <div class="field">
            <label for="regName">Full name</label>
            <input type="text" id="regName" required autocomplete="name" />
          </div>
          <div class="field">
            <label for="regUsername">Username</label>
            <input type="text" id="regUsername" required minlength="3" maxlength="30" autocomplete="username" autocapitalize="none" />
          </div>
          <div class="field">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" required minlength="6" autocomplete="new-password" />
          </div>
          <label class="show-pass"><input type="checkbox" id="showRegPass" /> Show Password</label>
          <button type="submit" class="btn">Register</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
