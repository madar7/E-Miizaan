<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>E-Miizaan — Set a new password</title>
<script src="js/theme.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/i18n/so.js"></script>
<script src="js/i18n/ar.js"></script>
<script src="js/i18n/i18n.js"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-bg">
    <div class="auth-window">
      <div class="auth-left">
        <div class="auth-avatar" id="authAvatar"></div>
        <h1 class="auth-title">E-Miizaan</h1>
        <p class="auth-sub">Income and Expenses Tracker</p>
        <div class="auth-switch">
          <a href="index.html" class="btn-outline">Back to sign in</a>
        </div>
      </div>
      <div class="auth-right">
        <h2>NEW PASSWORD</h2>
        <div id="errorBox" class="msg error" hidden></div>

        <form id="resetForm">
          <div class="field">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" required minlength="6" autocomplete="new-password" />
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password" />
          </div>
          <label class="show-pass"><input type="checkbox" id="showPass" /> Show Password</label>
          <button type="submit" class="btn" id="submitBtn">Update password</button>
        </form>

        <div id="invalidLinkBox" hidden>
          <p class="auth-note">This reset link is missing or invalid. Request a new one.</p>
          <a class="btn" href="forgot-password.html" style="display:inline-block;text-decoration:none;">Request a new link</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/icons.js"></script>
  <script>
    document.getElementById("authAvatar").innerHTML = ICONS.avatar;
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const email = params.get("email");

    const form = document.getElementById("resetForm");
    const errorBox = document.getElementById("errorBox");
    const submitBtn = document.getElementById("submitBtn");

    if (!token || !email) {
      form.hidden = true;
      document.getElementById("invalidLinkBox").hidden = false;
    }

    document.getElementById("showPass").addEventListener("change", (e) => {
      const t = e.target.checked ? "text" : "password";
      document.getElementById("newPassword").type = t;
      document.getElementById("confirmPassword").type = t;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideMsg(errorBox);
      const newPassword = document.getElementById("newPassword").value;
      if (newPassword !== document.getElementById("confirmPassword").value) {
        showMsg(errorBox, "Passwords don't match.");
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = "Updating…";
      try {
        const data = await apiRequest("/auth/reset-password", {
          method: "POST",
          auth: false,
          body: { email, token, password: newPassword },
        });
        setToken(data.token);
        setUser(data.user);
        window.location.href = "dashboard.html";
      } catch (err) {
        showMsg(errorBox, err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Update password";
      }
    });
  </script>
</body>
</html>
